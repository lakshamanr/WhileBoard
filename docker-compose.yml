services:
  webapi:
    build:
      context: ./WebAPI
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    depends_on:
      - database
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:5000
    networks:
      - appnet

  angularui:
    build:
      context: ./AngularProject
      dockerfile: Dockerfile
    ports:
      - "4200:4200"  # Exposing NGINX port
    networks:
      - appnet

  database:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      - SA_PASSWORD=P@ssword123
      - ACCEPT_EULA=Y
    ports:
      - "1433:1433"
    networks:
      - appnet

networks:
  appnet:
